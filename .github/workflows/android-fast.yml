name: Pi Droid fast contracts

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "fixtures/**/*.json"
      - "*.schema.json"
      - "*.openapi.json"
      - "test/android-contract-generation.test.mjs"
      - "flake.nix"
      - ".github/workflows/android-fast.yml"
  pull_request:
    paths:
      - "android/**"
      - "fixtures/**/*.json"
      - "*.schema.json"
      - "*.openapi.json"
      - "test/android-contract-generation.test.mjs"
      - "flake.nix"
      - ".github/workflows/android-fast.yml"

permissions:
  contents: read

concurrency:
  group: pi-droid-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Generated contracts and JVM tests
    runs-on: [self-hosted, nix, x86_64-linux]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Expose pinned Java to Gradle action
        shell: nix develop .#android --command bash -euo pipefail {0}
        run: |
          gradle_user_home="$RUNNER_TEMP/gradle-user-home"
          mkdir -p "$gradle_user_home"
          printf "JAVA_HOME=%s\n" "$JAVA_HOME" >> "$GITHUB_ENV"
          printf "GRADLE_USER_HOME=%s\n" "$gradle_user_home" >> "$GITHUB_ENV"
          # Compose/Skiko extracts JVM natives during the parallel semantics tests.
          # Keep those files inside this job instead of a shared host temp tree.
          printf "TMPDIR=%s\n" "$RUNNER_TEMP" >> "$GITHUB_ENV"
          dirname "$(command -v java)" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Verify deterministic generated Kotlin
        run: nix develop .#android --command node --test test/android-contract-generation.test.mjs
      - name: Check handwritten Kotlin and Gradle formatting
        run: |
          nix develop .#android --command bash -euo pipefail -c \
            "find android -type f \\( -name '*.kt' -o -name '*.kts' \\) -print0 | xargs -0 ktlint --relative"
      - name: Run JVM contract and Compose semantics tests
        run: |
          nix develop .#android --command \
            env -u DISPLAY \
            android/build-logic/run-with-xvfb.sh \
            ./android/gradlew -p android --no-daemon check

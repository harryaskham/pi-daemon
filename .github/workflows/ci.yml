name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: [self-hosted, nix, x86_64-linux]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ["22.19.0", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      # Cheap and Nix-free: an automated dependency bump cannot refresh the
      # pinned flake npmDepsHash, so say so here in seconds instead of letting
      # every Nix job fail later with a bare fixed-output mismatch.
      - run: npm run nix:deps-hash:fast
      # test/tls-fixture.mjs issues a real certificate pair, which node:crypto
      # cannot do — X509Certificate is parse-only — so openssl is a genuine
      # dependency of the suite. The Nix lanes get it from flake.nix; this lane
      # used to rely on whatever the runner image happened to provide, and when
      # that was nothing the TLS and credential fail-closed cases failed with a
      # bare spawn ENOENT that read like a product fault.
      - name: Provide the TLS fixture's openssl dependency
        run: |
          openssl_out="$(nix build --no-link --print-out-paths --inputs-from . 'nixpkgs#openssl.bin')"
          echo "OPENSSL_BIN=$openssl_out/bin/openssl" >> "$GITHUB_ENV"
        timeout-minutes: 10
      - run: npm test
      - run: npm run pack:check

  nix:
    name: Nix (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: [self-hosted, nix, x86_64-linux]
          - name: macOS
            runner: [self-hosted, macos]
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      # Cheap and decisive, so it runs before the long check: the tree must stay
      # converged on the formatter the flake itself declares, otherwise the next
      # narrow change inherits everyone else's reformatting churn.
      #
      # Formatting is a property of the repository text, so one platform settles
      # it. Running it on macOS too only bought a second copy of the same answer,
      # and cost a from-source alejandra build that timed out the step.
      - if: matrix.name == 'Linux x86_64'
        run: nix fmt -- --check flake.nix nix/
        timeout-minutes: 10
      - run: nix flake check --print-build-logs
        timeout-minutes: 25
      - run: nix run .#pi-daemon -- version
        timeout-minutes: 5

  dash-smoke:
    name: Dash browser smoke
    runs-on: [self-hosted, nix, x86_64-linux]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      # Node, npm, and the audited Playwright browsers all come from the e2e
      # shell, so this job never downloads a browser that a library-strict host
      # cannot run. It is the bounded `@smoke` subset, not the full suite: see
      # docs/dash-e2e.md for the gating assessment.
      - run: nix develop .#e2e --command npm ci --ignore-scripts
        timeout-minutes: 10
      - run: nix develop .#e2e --command npm run web:e2e:smoke
        timeout-minutes: 10
        env:
          # The runner cannot fork the browser's zygote; see
          # web/playwright-launch.mjs and docs/dash-e2e.md (bd-e3fa3e).
          PI_DAEMON_E2E_NO_SANDBOX: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dash-smoke-playwright
          path: |
            web/test-results
            web/playwright-report
          retention-days: 7
          if-no-files-found: ignore

name: CI (macOS)

# Separate from the fast lane on purpose. macOS verification is slow and, when
# no macOS runner is registered, unschedulable — and a job that cannot be
# assigned never completes. Optional queued PR checks also keep GitHub Stacks
# nonterminal even though branch protection requires only Flake readiness.
# Run Darwin coverage on accepted main, on a daily recovery cadence, or by
# explicit dispatch instead; pull requests retain the fast Linux/Node/browser
# gates and cannot be stranded behind absent hardware (bd-775c57, bd-ec9d00).

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      deliberate_test_failure:
        description: Prove that the phase runner reports a deliberately failing Node test as red
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Never cancel the only useful Darwin verdict. New commits remain serialized
  # by ref, while this workflow's dedicated group cannot block the fast lane.
  group: ci-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nix:
    name: Nix (macOS)
    runs-on: [self-hosted, macos]
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize bounded evidence directory
        shell: bash
        run: |
          {
            printf 'PI_DAEMON_NIX_CI_LOG_DIR=%s/pi-daemon-nix-macos-%s-%s\n' \
              "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'PI_DAEMON_NIX_CI_BUILD_NONCE=github-%s-%s\n' \
              "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_ENV"
        timeout-minutes: 1

      - name: Record cache and substitution state
        id: nix-state
        shell: bash
        run: bash scripts/report-nix-ci-cache-state.sh
        timeout-minutes: 5

      # This opt-in diagnostic is intentionally red. It exercises the same
      # status-preserving phase runner as the real package/check commands, so a
      # manual failure proof cannot accidentally become an allowed failure.
      - name: Deliberately failing test proof
        if: inputs.deliberate_test_failure
        shell: bash
        run: |
          printf 'import test from "node:test"; import assert from "node:assert/strict"; test("deliberate CI failure", () => assert.fail("expected red verdict"));\n' \
            > "$RUNNER_TEMP/pi-daemon-deliberate-failure.test.mjs"
          bash scripts/run-nix-ci-phase.sh deliberately-failing-test \
            node --test "$RUNNER_TEMP/pi-daemon-deliberate-failure.test.mjs"
        timeout-minutes: 5

      # PR 26 measured 12m08s in install and 29m27s in fixup alone before the
      # former monolithic 50-minute step expired. The run-attempt nonce gives the
      # package a new output path, so an ordinary build must execute the complete
      # test/install/fixup/installCheck pipeline even when the shared store is
      # warm. Its only GC root is the job-private result under RUNNER_TEMP; this
      # workflow never deletes or invalidates a shared-store output.
      - name: Build package, tests, fixup, and install checks from an absent output
        shell: bash
        run: |
          if [[ "${{ steps.nix-state.outputs.package_store_state }}" != missing ]]; then
            echo '::error title=Job-unique package output is not cold::The run-attempt nonce must select an absent output before the normal build.'
            exit 1
          fi
          bash scripts/run-nix-ci-package.sh \
            "${{ steps.nix-state.outputs.system }}"
        timeout-minutes: 75

      # The expensive package is now valid in the store. Keep the complete flake
      # assertion so Pages, Home Manager, generated contracts, workflow syntax,
      # and every other check still contribute to the final verdict.
      - name: Check the complete flake
        shell: bash
        run: |
          bash scripts/run-nix-ci-phase.sh flake-check \
            nix flake check --impure --print-build-logs
        timeout-minutes: 30

      - name: Verify the installed app entry point
        shell: bash
        run: |
          bash scripts/run-nix-ci-phase.sh installed-version \
            nix run --impure .#pi-daemon -- version
        timeout-minutes: 5

      - name: Retain macOS Nix phase evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nix-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pi-daemon-nix-macos-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn

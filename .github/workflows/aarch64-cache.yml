name: AArch64 Linux closure cache

# This publisher is intentionally outside fast CI. A later landing must not
# cancel the one run that can leave Nix-on-Droid consumers with a usable exact
# closure; GitHub may coalesce queued runs, but the active publisher finishes.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-daemon-aarch64-linux-closure
  cancel-in-progress: false

jobs:
  publish:
    name: Build, emulate, and publish aarch64-linux
    runs-on: [self-hosted, nix, x86_64-linux]
    timeout-minutes: 120
    environment: pi-daemon-aarch64-cache
    env:
      ATTIC_ENDPOINT: ${{ vars.PI_DAEMON_ATTIC_ENDPOINT }}
      ATTIC_CACHE: ${{ vars.PI_DAEMON_ATTIC_CACHE }}
      ATTIC_TOKEN: ${{ secrets.PI_DAEMON_ATTIC_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate publisher and binfmt configuration
        shell: bash
        run: |
          set -euo pipefail
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/pi-daemon-aarch64-xdg" >> "$GITHUB_ENV"
          if [[ ! "$ATTIC_ENDPOINT" =~ ^https?:// ]]; then
            echo '::error title=AArch64 cache endpoint is not configured::Set PI_DAEMON_ATTIC_ENDPOINT in the pi-daemon-aarch64-cache environment.'
            exit 1
          fi
          if [[ ! "$ATTIC_CACHE" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo '::error title=AArch64 cache name is not configured::Set PI_DAEMON_ATTIC_CACHE to a simple Attic cache name.'
            exit 1
          fi
          if [[ -z "$ATTIC_TOKEN" ]]; then
            echo '::error title=AArch64 cache token is not configured::Set PI_DAEMON_ATTIC_TOKEN in the pi-daemon-aarch64-cache environment.'
            exit 1
          fi
          command -v attic >/dev/null || {
            echo '::error title=Attic client missing::Install attic on the self-hosted Nix publisher.'
            exit 1
          }

          nix config show --json > "$RUNNER_TEMP/nix-config-before-attic.json"
          node --input-type=module - "$RUNNER_TEMP/nix-config-before-attic.json" <<'NODE'
          import { readFile } from "node:fs/promises";
          const config = JSON.parse(await readFile(process.argv[2], "utf8"));
          if (!config["extra-platforms"]?.value?.includes("aarch64-linux")) {
            throw new Error("Nix extra-platforms does not include aarch64-linux");
          }
          NODE

          found_binfmt=false
          for registration in /proc/sys/fs/binfmt_misc/*aarch64*; do
            if [[ -f "$registration" ]] && grep -qx enabled "$registration"; then
              found_binfmt=true
              break
            fi
          done
          if [[ "$found_binfmt" != true ]]; then
            echo '::error title=AArch64 binfmt is unavailable::The publisher must register an enabled aarch64 interpreter.'
            exit 1
          fi

      - name: Add the signed private Attic substituter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$XDG_CONFIG_HOME"
          chmod 700 "$XDG_CONFIG_HOME"
          # Keep credentials in an isolated config that the final cleanup
          # removes. GitHub masks the secret argument; no command prints it.
          attic login --set-default pi-daemon-ci "$ATTIC_ENDPOINT" "$ATTIC_TOKEN"
          attic cache info "pi-daemon-ci:${ATTIC_CACHE}" \
            | tee "$RUNNER_TEMP/attic-cache-info.log"
          attic use "pi-daemon-ci:${ATTIC_CACHE}"

          # `attic use` must be additive: cache.nixos.org remains available and
          # Nix must continue rejecting unsigned/untrusted non-CA store paths.
          nix config show --json > "$RUNNER_TEMP/nix-config-with-attic.json"
          node --input-type=module - "$RUNNER_TEMP/nix-config-with-attic.json" <<'NODE'
          import { readFile } from "node:fs/promises";
          const config = JSON.parse(await readFile(process.argv[2], "utf8"));
          const substituters = config.substituters?.value ?? [];
          const normalizeUrl = (value) => {
            const url = new URL(value);
            url.search = "";
            url.hash = "";
            return url.toString().replace(/\/$/, "");
          };
          const hasNixos = substituters.some((value) => normalizeUrl(value) === "https://cache.nixos.org");
          if (!hasNixos) throw new Error("attic use replaced cache.nixos.org instead of adding a substituter");
          const expectedAttic = normalizeUrl(`${process.env.ATTIC_ENDPOINT.replace(/\/$/, "")}/${process.env.ATTIC_CACHE}`);
          if (!substituters.some((value) => normalizeUrl(value) === expectedAttic)) {
            throw new Error("the configured Attic cache is absent from effective Nix substituters");
          }
          if (config["require-sigs"]?.value !== true) {
            throw new Error("Nix signature verification must remain enabled");
          }
          NODE

      - name: Build the exact aarch64-linux package
        id: build
        shell: bash
        run: |
          set -euo pipefail
          log_dir="$RUNNER_TEMP/aarch64-cache"
          mkdir -p "$log_dir"
          output_file="$log_dir/output-path"
          nix build --no-link --print-out-paths --print-build-logs \
            --option require-sigs true \
            '.#packages.aarch64-linux.pi-daemon' \
            >"$output_file" 2> >(tee "$log_dir/build.log" >&2)
          mapfile -t outputs < "$output_file"
          if [[ "${#outputs[@]}" -ne 1 || "${outputs[0]}" != /nix/store/* ]]; then
            echo '::error title=Unexpected aarch64 package output::The exact package build must produce one Nix store path.'
            exit 1
          fi
          echo "out=${outputs[0]}" >> "$GITHUB_OUTPUT"

      - name: Verify installed aarch64 binaries under emulation
        shell: bash
        env:
          PACKAGE_OUT: ${{ steps.build.outputs.out }}
        run: |
          set -euo pipefail
          {
            "$PACKAGE_OUT/bin/pi-daemon" version | grep -Fx 0.3.0
            "$PACKAGE_OUT/bin/pi-daemon-rpc" --version | grep -Fx 0.3.0
          } | tee "$RUNNER_TEMP/aarch64-cache/version-checks.log"

      - name: Push the exact output closure to Attic
        shell: bash
        env:
          PACKAGE_OUT: ${{ steps.build.outputs.out }}
        run: |
          set -euo pipefail
          attic push -j1 "pi-daemon-ci:${ATTIC_CACHE}" "$PACKAGE_OUT" \
            2>&1 | tee "$RUNNER_TEMP/aarch64-cache/attic-push.log"
          {
            echo '### Pi Daemon aarch64-linux closure'
            echo "- source: \`${GITHUB_SHA}\`"
            echo "- exact output: \`${PACKAGE_OUT}\`"
            echo "- cache: \`${ATTIC_CACHE}\`"
            echo '- verification: both installed version commands executed under binfmt'
            echo '- trust: signed Attic substitution with Nix require-sigs enabled'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove Attic credentials
        if: always()
        shell: bash
        run: |
          rm -rf "$XDG_CONFIG_HOME"
          rm -f "$RUNNER_TEMP/nix-config-before-attic.json" \
            "$RUNNER_TEMP/nix-config-with-attic.json" \
            "$RUNNER_TEMP/attic-cache-info.log"

      - name: Retain closure publisher logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aarch64-cache-${{ github.run_id }}
          path: ${{ runner.temp }}/aarch64-cache
          retention-days: 14
          if-no-files-found: warn

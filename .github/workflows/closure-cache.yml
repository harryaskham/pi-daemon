name: Supported-system closure cache

# This publisher is intentionally outside fast CI. A later landing must not
# cancel an active build that can leave consumers with a usable exact closure.
# Concurrency is target-scoped so all supported systems can progress independently.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build, verify, and publish ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    environment: pi-daemon-aarch64-cache
    concurrency:
      group: pi-daemon-closure-${{ matrix.system }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: aarch64-linux
            runner: [self-hosted, nix, x86_64-linux]
            timeout: 120
            execution: binfmt
          - system: x86_64-linux
            runner: [self-hosted, nix, x86_64-linux]
            timeout: 60
            execution: native
          - system: aarch64-darwin
            runner: [self-hosted, macos]
            timeout: 120
            execution: native
          - system: x86_64-darwin
            runner: [self-hosted, macos]
            timeout: 120
            execution: extra-platform
    env:
      ATTIC_ENDPOINT: ${{ vars.PI_DAEMON_ATTIC_ENDPOINT }}
      ATTIC_CACHE: ${{ vars.PI_DAEMON_ATTIC_CACHE }}
      TARGET_SYSTEM: ${{ matrix.system }}
      TARGET_EXECUTION: ${{ matrix.execution }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          # The shared runner principal serves multiple repositories. Nix
          # trusted-users is root-equivalent, so never let setup grant it trust.
          set_as_trusted_user: false

      - name: Validate repository-pinned publisher shell
        shell: bash
        run: |
          set -euo pipefail
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/pi-daemon-closure-$TARGET_SYSTEM-xdg" >> "$GITHUB_ENV"
          nix develop .#closurePublisher --command attic --version

      - name: Validate publisher and target execution
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$ATTIC_ENDPOINT" =~ ^https?:// ]]; then
            echo '::error title=Closure cache endpoint is not configured::Set PI_DAEMON_ATTIC_ENDPOINT in the pi-daemon-aarch64-cache environment.'
            exit 1
          fi
          if [[ ! "$ATTIC_CACHE" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo '::error title=Closure cache name is not configured::Set PI_DAEMON_ATTIC_CACHE to a simple Attic cache name.'
            exit 1
          fi
          current_system="$(nix eval --raw --impure --expr builtins.currentSystem)"
          export CURRENT_SYSTEM="$current_system"
          echo "CURRENT_SYSTEM=$current_system" >> "$GITHUB_ENV"
          nix config show --json > "$RUNNER_TEMP/nix-config-before-attic-$TARGET_SYSTEM.json"
          nix store ping --json > "$RUNNER_TEMP/nix-store-trust-$TARGET_SYSTEM.json"
          node --input-type=module - \
            "$RUNNER_TEMP/nix-config-before-attic-$TARGET_SYSTEM.json" \
            "$RUNNER_TEMP/nix-store-trust-$TARGET_SYSTEM.json" <<'NODE'
          import { readFile } from "node:fs/promises";
          const config = JSON.parse(await readFile(process.argv[2], "utf8"));
          const store = JSON.parse(await readFile(process.argv[3], "utf8"));
          const target = process.env.TARGET_SYSTEM;
          const current = process.env.CURRENT_SYSTEM;
          const extraPlatforms = config["extra-platforms"]?.value ?? [];
          if (target !== current && !extraPlatforms.includes(target)) {
            throw new Error(`Nix cannot execute ${target}: current system is ${current} and extra-platforms does not include the target`);
          }
          // bd-833b3e: Linux self-hosted runner units share one `github-runner`
          // Unix user across repositories. Nix documents trusted-users as
          // root-equivalent, so the publisher must prove this generic principal
          // stays UNTRUSTED rather than demand the privilege.
          if (process.env.RUNNER_OS === "Linux" && (store.trusted === 1 || store.trusted === true)) {
            throw new Error("the shared github-runner principal is unexpectedly a trusted Nix client; revoke broad runner trust before publishing");
          }
          const normalizeUrl = (value) => {
            const url = new URL(value);
            url.search = "";
            url.hash = "";
            return url.toString().replace(/\/$/, "");
          };
          const substituters = config.substituters?.value ?? [];
          if (!substituters.some((value) => normalizeUrl(value) === "https://cache.nixos.org")) {
            throw new Error("the host Nix configuration dropped cache.nixos.org instead of adding the signed Attic cache");
          }
          const expectedAttic = normalizeUrl(`${process.env.ATTIC_ENDPOINT.replace(/\/$/, "")}/${process.env.ATTIC_CACHE}`);
          if (!substituters.some((value) => normalizeUrl(value) === expectedAttic)) {
            throw new Error(`the exact Attic cache ${expectedAttic} is not declared by the host Nix configuration`);
          }
          const trustedKeys = config["trusted-public-keys"]?.value ?? [];
          if (!trustedKeys.some((value) => value.startsWith("collective:"))) {
            throw new Error("the host Nix configuration does not declare a collective cache signing key");
          }
          if (config["require-sigs"]?.value !== true) {
            throw new Error("Nix signature verification must remain enabled");
          }
          NODE
          attic_substituter="${ATTIC_ENDPOINT%/}/${ATTIC_CACHE}"
          echo "ATTIC_SUBSTITUTER=$attic_substituter" >> "$GITHUB_ENV"

          if [[ "$TARGET_EXECUTION" == binfmt && "$TARGET_SYSTEM" == aarch64-linux && "$current_system" != aarch64-linux ]]; then
            found_binfmt=false
            for registration in /proc/sys/fs/binfmt_misc/*aarch64*; do
              if [[ -f "$registration" ]] && grep -qx enabled "$registration"; then
                found_binfmt=true
                break
              fi
            done
            if [[ "$found_binfmt" != true ]]; then
              echo '::error title=AArch64 binfmt is unavailable::The Linux ARM publisher must register an enabled aarch64 interpreter.'
              exit 1
            fi
          fi

      - name: Build the exact ${{ matrix.system }} package
        id: build
        shell: bash
        run: |
          set -euo pipefail
          log_dir="$RUNNER_TEMP/closure-cache-$TARGET_SYSTEM"
          mkdir -p "$log_dir"
          output_file="$log_dir/output-path"
          nix build --no-link --print-out-paths --print-build-logs \
            --option require-sigs true \
            ".#packages.${TARGET_SYSTEM}.pi-daemon" \
            >"$output_file" 2> >(tee "$log_dir/build.log" >&2)
          output_count=0
          package_out=""
          while IFS= read -r output_path || [[ -n "$output_path" ]]; do
            [[ -n "$output_path" ]] || continue
            output_count=$((output_count + 1))
            package_out="$output_path"
          done < "$output_file"
          if [[ "$output_count" -ne 1 || "$package_out" != /nix/store/* ]]; then
            echo "::error title=Unexpected $TARGET_SYSTEM package output::The exact package build must produce one Nix store path."
            exit 1
          fi
          echo "out=$package_out" >> "$GITHUB_OUTPUT"
          nix path-info --closure-size --human-readable "$package_out" \
            | tee "$log_dir/closure-size.log"

      - name: Verify installed ${{ matrix.system }} binaries
        shell: bash
        env:
          PACKAGE_OUT: ${{ steps.build.outputs.out }}
        run: |
          set -euo pipefail
          {
            "$PACKAGE_OUT/bin/pi-daemon" version | grep -Fx 0.3.0
            "$PACKAGE_OUT/bin/pi-daemon-rpc" --version | grep -Fx 0.3.0
          } | tee "$RUNNER_TEMP/closure-cache-$TARGET_SYSTEM/version-checks.log"

      - name: Authenticate and push the exact output closure to Attic
        shell: bash
        env:
          PACKAGE_OUT: ${{ steps.build.outputs.out }}
          # Push-only credential: repository build and signed hydration never
          # receive this environment value or the generated Attic config.
          ATTIC_TOKEN: ${{ secrets.PI_DAEMON_ATTIC_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$ATTIC_TOKEN" ]]; then
            echo '::error title=Closure cache token is not configured::Set PI_DAEMON_ATTIC_TOKEN in the pi-daemon-aarch64-cache environment.'
            exit 1
          fi
          mkdir -p "$XDG_CONFIG_HOME"
          chmod 700 "$XDG_CONFIG_HOME"
          nix develop .#closurePublisher --command attic login --set-default pi-daemon-ci "$ATTIC_ENDPOINT" "$ATTIC_TOKEN"
          nix develop .#closurePublisher --command attic cache info "pi-daemon-ci:${ATTIC_CACHE}" \
            | tee "$RUNNER_TEMP/attic-cache-info-$TARGET_SYSTEM.log"
          nix develop .#closurePublisher --command attic push -j1 "pi-daemon-ci:${ATTIC_CACHE}" "$PACKAGE_OUT" \
            2>&1 | tee "$RUNNER_TEMP/closure-cache-$TARGET_SYSTEM/attic-push.log"
          # Public signed reads are host-declared. Remove push credentials before
          # the hydration step so private-read auth cannot pass accidentally.
          rm -rf "$XDG_CONFIG_HOME"

      - name: Hydrate the exact signed closure from Attic
        shell: bash
        env:
          PACKAGE_OUT: ${{ steps.build.outputs.out }}
        run: |
          set -euo pipefail
          log_dir="$RUNNER_TEMP/closure-cache-$TARGET_SYSTEM"
          canonical_runner_temp="$(cd "$RUNNER_TEMP" && pwd -P)"
          hydration_root="$canonical_runner_temp/attic-hydration-$TARGET_SYSTEM"
          hydration_store="local?root=$hydration_root"
          mkdir -p "$hydration_root"
          nix copy --option require-sigs true \
            --from "$ATTIC_SUBSTITUTER" \
            --to "$hydration_store" \
            "$PACKAGE_OUT" \
            2> >(tee "$log_dir/attic-hydration.log" >&2)
          hydrated_out=""
          IFS= read -r hydrated_out < <(
            nix path-info --store "$hydration_store" "$PACKAGE_OUT"
          )
          if [[ "$hydrated_out" != "$PACKAGE_OUT" || ! -x "$hydration_root$PACKAGE_OUT/bin/pi-daemon" ]]; then
            echo '::error title=Attic hydration did not reproduce the exact output::The signed cache must hydrate the captured package into an empty isolated local store.'
            exit 1
          fi
          printf '%s\n' "$hydrated_out" > "$log_dir/attic-hydrated-output"
          {
            echo "### Pi Daemon $TARGET_SYSTEM closure"
            echo "- source: \`${GITHUB_SHA}\`"
            echo "- exact output: \`${PACKAGE_OUT}\`"
            echo "- cache: \`${ATTIC_CACHE}\`"
            echo "- execution: \`${TARGET_EXECUTION}\` from \`${CURRENT_SYSTEM}\`"
            echo '- verification: both installed version commands executed'
            echo '- trust: exact output rehydrated from Attic into an empty local store with require-sigs enabled'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove Attic credentials
        if: always()
        shell: bash
        run: |
          rm -rf "$XDG_CONFIG_HOME" "$RUNNER_TEMP/attic-hydration-$TARGET_SYSTEM"
          rm -f "$RUNNER_TEMP/nix-config-before-attic-$TARGET_SYSTEM.json" \
            "$RUNNER_TEMP/nix-store-trust-$TARGET_SYSTEM.json" \
            "$RUNNER_TEMP/attic-cache-info-$TARGET_SYSTEM.log"

      - name: Retain closure publisher logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: closure-cache-${{ matrix.system }}-${{ github.run_id }}
          path: ${{ runner.temp }}/closure-cache-${{ matrix.system }}
          retention-days: 14
          if-no-files-found: warn

name: Pi Droid internal release

on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: Monotonic Play version code
        required: true
        default: "2"
        type: string
      versionName:
        description: Bounded internal release name
        required: true
        default: 0.3.0-internal.2
        type: string

permissions:
  contents: read

concurrency:
  group: pi-droid-play-internal
  cancel-in-progress: false

jobs:
  release:
    name: Signed AAB to Play internal
    environment: google-play-internal
    runs-on: [self-hosted, nix, x86_64-linux]
    timeout-minutes: 90
    env:
      PI_DROID_PLAY_TRACK: internal
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Materialize Play release secrets
        shell: nix develop .#androidRelease --command bash -euo pipefail {0}
        env:
          PI_DROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.PI_DROID_RELEASE_KEYSTORE_BASE64 }}
          PI_DROID_RELEASE_KEY_ALIAS: ${{ secrets.PI_DROID_RELEASE_KEY_ALIAS }}
          PI_DROID_RELEASE_STORE_PASSWORD: ${{ secrets.PI_DROID_RELEASE_STORE_PASSWORD }}
          PI_DROID_RELEASE_KEY_PASSWORD: ${{ secrets.PI_DROID_RELEASE_KEY_PASSWORD }}
          PI_DROID_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PI_DROID_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: android/build-logic/materialize-play-release-secrets.sh
      - name: Expose pinned Java to Gradle action
        shell: nix develop .#androidRelease --command bash -euo pipefail {0}
        run: |
          gradle_user_home="$RUNNER_TEMP/gradle-user-home"
          mkdir -p "$gradle_user_home"
          printf "JAVA_HOME=%s\n" "$JAVA_HOME" >> "$GITHUB_ENV"
          printf "GRADLE_USER_HOME=%s\n" "$gradle_user_home" >> "$GITHUB_ENV"
          printf "TMPDIR=%s\n" "$RUNNER_TEMP" >> "$GITHUB_ENV"
          dirname "$(command -v java)" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
      - name: Build and verify signed AAB without an emulator
        run: |
          nix develop .#androidRelease --command \
            android/build-logic/release-internal.sh \
            --version-code '${{ inputs.versionCode }}' \
            --version-name '${{ inputs.versionName }}' \
            --artifacts "$RUNNER_TEMP/pi-droid-release" \
            --prepare-only \
            --skip-emulator
      - name: Verify prepared evidence before Play mutation
        shell: nix develop .#androidRelease --command bash -euo pipefail {0}
        run: |
          test -f "$RUNNER_TEMP/pi-droid-release/pi-droid-release.aab"
          test -f "$RUNNER_TEMP/pi-droid-release/mapping.txt"
          test -f "$RUNNER_TEMP/pi-droid-release/sha256sums.txt"
          test -f "$RUNNER_TEMP/pi-droid-release/release-build-receipt.json"
          jq -e '.emulatorEvidence == false' "$RUNNER_TEMP/pi-droid-release/release-build-receipt.json" >/dev/null
      - name: Publish exact prepared AAB to internal only
        run: |
          nix develop .#androidRelease --command \
            android/build-logic/release-internal.sh \
            --version-code '${{ inputs.versionCode }}' \
            --version-name '${{ inputs.versionName }}' \
            --artifacts "$RUNNER_TEMP/pi-droid-release" \
            --upload-prepared
      - name: Verify remote Play receipt
        run: test -f "$RUNNER_TEMP/pi-droid-release/play-internal-receipt.json"
      - name: Retain signed internal release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pi-droid-internal-${{ inputs.versionCode }}
          path: ${{ runner.temp }}/pi-droid-release
          if-no-files-found: warn
          retention-days: 30
      - name: Remove Play release secrets
        if: always()
        run: android/build-logic/cleanup-play-release-secrets.sh
